[package]
name = "game-power-plan-switcher"
version = "2.3.6"
authors = ["NN6"]
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
# The public winit 0.30 accessor is version-specific. Keep Slint pinned and
# revalidate native move/resize release handling before upgrading this feature.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg", "accessibility", "raw-window-handle-06", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
base64 = "0.22"
png = "0.18"
raw-window-handle = "0.6"
sha2 = "0.10"
hex = "0.4"
nvml-wrapper = "=0.13.0"

[build-dependencies]
slint-build = "=1.18.1"
cc = "1"

[profile.release]
# LTO/panic/incremental belong on the root profile, not package overrides.
# Rust fat LTO does not imply cross-language LTO for the native C++ bridge.
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = "symbols"
panic = "abort"
overflow-checks = false
debug = false
debug-assertions = false
incremental = false

[[bin]]
name = "Game-Power-Plan-Switcher"
path = "src/main.rs"
